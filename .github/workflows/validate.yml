name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # continue-on-error: the only current failure is the "brands" check, which
    # requires icon assets submitted to home-assistant/brands (or a local
    # custom_components/anova_oven/brand/icon.png). That's only required for
    # default-HACS-store inclusion, not for installing via HACS's "Custom
    # repositories" — remove this once real brand assets are added.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
